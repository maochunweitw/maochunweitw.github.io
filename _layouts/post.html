---
layout: default
---
<article class="post">
  <header class="post-header">
    {% if page.categories %}
      <p class="post-category">{{ page.categories | first }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    <time>{{ page.date | date: "%Y.%m.%d" }}</time>
  </header>
  <div class="post-content">
    { { content }}
  </div>
  <p class="back-link"><a href="{{ '/' | relative_url }}">■ 嗞兌馆餾</a></p>
</article>
