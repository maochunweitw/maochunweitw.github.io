---
layout: default
---
<article class="post"><header class="post-header">
{% if page.categories %}<div class="post-category">{{ page.categories | join: " · " }}</div>{% endif %}
<h1>{{ page.title }}</h1>
<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y 年 %m 月 %d 日" }}</time>
{% if page.tags %}
<div class="post-tags">
{% for tag in page.tags %}
<span>#{{ tag }}</span>
{% endfor %}
</div>
{% endif %}
</header><div class="post-content">{{ content }}</div><div class="back-link"><a href="{{ '/' | relative_url }}">← 回到首頁</a></div></article>
